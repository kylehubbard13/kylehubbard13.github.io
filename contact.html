<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Kyle Hubbard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main>
    <h1>Contact</h1>
    <p>Have a project or question? Send a message below.</p>

    <!-- TODO: confirm this is the right address to receive messages at -->
    <form action="mailto:kylehubbard13@gmail.com" method="post" enctype="text/plain" class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn">Send</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kyle Hubbard</p>
  </footer>

  <script src="/headerLoader.js"></script>
</body>
</html>
